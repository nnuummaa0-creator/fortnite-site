<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de conta</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 420px;
    max-width: 92%;
    background: #18181d;
    padding: 42px;
    border-radius: 4px;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 30px;
    letter-spacing: 1px;
}

h1 {
    font-size: 24px;
    margin-bottom: 8px;
}

.subtitle {
    color: #999;
    font-size: 13px;
    margin-bottom: 25px;
}

.demo {
    background: #332b08;
    border: 1px solid #806d00;
    color: #ffe600;
    padding: 10px;
    font-size: 11px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    background: #0f0f12;
    border: 1px solid #44444c;
    color: white;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #777;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    background: #f2f500;
    color: #111;
    font-weight: 900;
    cursor: pointer;
    margin-top: 5px;
}

button:hover {
    background: white;
}

.note {
    color: #777;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 20px;
}

.back {
    display: block;
    margin-top: 20px;
    color: #aaa;
    font-size: 12px;
    text-decoration: none;
}

.back:hover {
    color: white;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">FORTNITE</div>

    <div class="demo">
        DEMONSTRAÇÃO — NÃO É O LOGIN OFICIAL DA EPIC GAMES
    </div>

    <h1>Verificar conta</h1>

    <div class="subtitle">
        Entre para iniciar a demonstração da avaliação.
    </div>

    <input
        type="text"
        placeholder="Email ou nome de utilizador"
        autocomplete="off"
    >

    <input
        type="password"
        placeholder="Palavra-passe"
        autocomplete="off"
    >

    <button onclick="continuar()">
        CONTINUAR
    </button>

    <div class="note">
        Esta página é apenas uma demonstração visual.
        Nenhuma palavra-passe é enviada ou armazenada.
    </div>

    <a href="index.html" class="back">
        ← Voltar
    </a>

</div>

<script>
function continuar() {
    alert(
        "Demonstração concluída!\\n\\n" +
        "Nenhuma credencial foi enviada ou armazenada."
    );
}
</script>

</body>
</html>
